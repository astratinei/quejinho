<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFE4EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1B0F26" media="(prefers-color-scheme: dark)">
<meta name="description" content="Queijinho: a cute Brazilian Portuguese app for everyday life. Works offline.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Queijinho">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Queijinho</title>
<style>
@font-face{font-family:"Baloo 2";font-weight:600;font-style:normal;font-display:swap;src:url("fonts/baloo-2-600.woff2") format("woff2")}
@font-face{font-family:"Baloo 2";font-weight:700;font-style:normal;font-display:swap;src:url("fonts/baloo-2-700.woff2") format("woff2")}
@font-face{font-family:"Baloo 2";font-weight:800;font-style:normal;font-display:swap;src:url("fonts/baloo-2-800.woff2") format("woff2")}
@font-face{font-family:"Nunito";font-weight:600;font-style:normal;font-display:swap;src:url("fonts/nunito-600.woff2") format("woff2")}
@font-face{font-family:"Nunito";font-weight:700;font-style:normal;font-display:swap;src:url("fonts/nunito-700.woff2") format("woff2")}
@font-face{font-family:"Nunito";font-weight:800;font-style:normal;font-display:swap;src:url("fonts/nunito-800.woff2") format("woff2")}
/* Layout idea: a sticker book. Chunky plum outlines, hard offset shadows, pastel cards, one golden cheese-bread mascot. */
:root{
  --bg:#FFE4EC; --dot:rgba(255,92,138,.20); --card:#FFFFFF; --ink:#3A1D4A; --soft:#7A5A8C;
  --line:#3A1D4A; --shadow:#3A1D4A; --track:rgba(58,29,74,.16);
  --cheese:#FFC93C; --guava:#FF7AA2; --mint:#7ADBB4; --sky:#8CCBFF; --lilac:#C9B3FF;
  --on:#3A1D4A; --bad:#FF9AA5;
  --display:'Baloo 2','Fredoka','Trebuchet MS',system-ui,sans-serif;
  --body:'Nunito','Segoe UI',system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1B0F26; --dot:rgba(255,122,162,.10); --card:#2C1A3B; --ink:#FFEFF6; --soft:#C9AFDB;
    --line:#F3D9EA; --shadow:#0B0512; --track:rgba(255,239,246,.16);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1B0F26; --dot:rgba(255,122,162,.10); --card:#2C1A3B; --ink:#FFEFF6; --soft:#C9AFDB;
  --line:#F3D9EA; --shadow:#0B0512; --track:rgba(255,239,246,.16);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  background-color:var(--bg);
  background-image:radial-gradient(var(--dot) 2.5px,transparent 3px);
  background-size:24px 24px;
  color:var(--ink);font-family:var(--body);font-weight:600;font-size:16px;line-height:1.4;
  -webkit-tap-highlight-color:transparent;
}
#app{max-width:520px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 16px 120px}
h1,h2,h3,.disp{font-family:var(--display);font-weight:800;line-height:1.05;margin:0;text-wrap:balance}
h1{font-size:34px}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--guava);outline-offset:3px;border-radius:12px}
small{font-weight:700;color:var(--soft)}
.sub{color:var(--soft);font-weight:700}

/* buttons + cards */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;
  min-height:54px;padding:10px 22px;border:3px solid var(--line);border-radius:18px;
  background:var(--cheese);color:var(--on);font-family:var(--display);font-weight:800;font-size:20px;line-height:1.1;
  box-shadow:0 5px 0 var(--shadow);transition:transform .08s,box-shadow .08s;
}
.btn small{color:var(--on);opacity:.75;font-family:var(--body);font-size:14px}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--shadow)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.pink{background:var(--guava)} .btn.mint{background:var(--mint)} .btn.sky{background:var(--sky)} .btn.lilac{background:var(--lilac)}
.btn.wide{width:100%}
.card{background:var(--card);border:3px solid var(--line);border-radius:22px;box-shadow:0 5px 0 var(--shadow);padding:16px}
.back{display:inline-flex;align-items:center;gap:6px;background:none;border:0;padding:8px 4px;font-family:var(--display);font-weight:700;font-size:18px;color:var(--soft)}
.sec{font-size:24px;margin:26px 0 12px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sec small{font-family:var(--body);font-size:14px}

/* home */
.hero{display:flex;align-items:center;gap:8px;margin:4px 0 14px}
.hero .bubble{
  position:relative;flex:1;background:var(--card);border:3px solid var(--line);border-radius:22px;
  box-shadow:0 5px 0 var(--shadow);padding:14px 16px;
}
.hero .bubble::before{
  content:"";position:absolute;left:-12px;top:50%;width:18px;height:18px;background:var(--card);
  border-left:3px solid var(--line);border-bottom:3px solid var(--line);transform:translateY(-50%) rotate(45deg);
}
.hero .disp{font-size:26px;margin-bottom:2px}
.mascot{display:block;flex:none;overflow:visible}
.bob{animation:bob 3.2s ease-in-out infinite}
.eyes{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.chip{
  display:flex;flex-direction:column;align-items:center;gap:0;background:var(--card);border:3px solid var(--line);
  border-radius:18px;box-shadow:0 4px 0 var(--shadow);padding:8px 4px 6px;text-align:center;
}
.chip b{font-family:var(--display);font-size:26px;line-height:1.1}
.chip small{font-size:12px;line-height:1.1}
.goal{display:flex;flex-direction:column;gap:8px;margin-bottom:18px}
.goal .row{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--display);font-weight:800;font-size:18px}
.meter{height:16px;background:var(--track);border:3px solid var(--line);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--guava);border-radius:99px;transition:width .4s}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tcard{
  display:flex;flex-direction:column;gap:4px;text-align:left;min-height:150px;padding:14px;
  background:var(--c);color:var(--on);border:3px solid var(--line);border-radius:22px;box-shadow:0 5px 0 var(--shadow);
  transition:transform .08s,box-shadow .08s;
}
.tcard:active{transform:translateY(4px);box-shadow:0 1px 0 var(--shadow)}
.tcard .te{width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.6);border:3px solid var(--on);display:grid;place-items:center;margin-bottom:2px}
.tcard .tn{font-family:var(--display);font-weight:800;font-size:22px;line-height:1.05;margin-top:4px}
.tcard .ts{font-size:13px;font-weight:700;opacity:.8;line-height:1.2}
.tcard .tp{margin-top:auto;display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800}
.tcard .tp .meter{flex:1;height:10px;border-width:2px;border-color:var(--on);background:rgba(58,29,74,.18)}
.tcard .tp .meter i{background:var(--on)}
footer{margin-top:30px;text-align:center}
.link{background:none;border:0;color:var(--soft);font-weight:700;text-decoration:underline;padding:8px}

/* topic page */
.thead{display:flex;align-items:center;gap:14px;background:var(--c);color:var(--on);border:3px solid var(--line);border-radius:24px;box-shadow:0 5px 0 var(--shadow);padding:16px;margin:4px 0 16px}
.thead .te{width:68px;height:68px;flex:none;border-radius:50%;background:rgba(255,255,255,.6);border:3px solid var(--on);display:grid;place-items:center}
.thead .sub{color:var(--on);opacity:.8}
.tip{margin-bottom:16px}
.tip b{font-family:var(--display);font-size:18px;display:block;margin-bottom:2px}
.acts{display:grid;grid-template-columns:1fr;gap:12px}
.acts .btn{justify-content:space-between;text-align:left;padding:10px 18px}
.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.plist li{display:flex;align-items:center;gap:12px;background:var(--card);border:3px solid var(--line);border-radius:18px;padding:10px 12px;box-shadow:0 3px 0 var(--shadow)}
.plist .tx{flex:1;min-width:0}
.plist .pt{font-family:var(--display);font-weight:800;font-size:20px;line-height:1.15;overflow-wrap:anywhere}
.plist .en{font-size:15px}
.plist .say{font-size:13px;color:var(--soft);font-style:italic}
.dots{display:flex;gap:3px;flex:none}
.dots i{width:9px;height:9px;border-radius:50%;border:2px solid var(--line);background:transparent}
.dots i.on{background:var(--cheese)}
.spk{
  flex:none;width:46px;height:46px;border-radius:50%;border:3px solid var(--line);background:var(--sky);color:var(--on);
  display:inline-grid;place-items:center;box-shadow:0 3px 0 var(--shadow);padding:0;transition:transform .08s,box-shadow .08s;
}
.spk:active{transform:translateY(2px);box-shadow:0 1px 0 var(--shadow)}
.spk svg{width:22px;height:22px}

/* session */
.top{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.x{flex:none;width:44px;height:44px;border-radius:50%;border:3px solid var(--line);background:var(--card);display:grid;place-items:center;padding:0;box-shadow:0 3px 0 var(--shadow)}
.top .meter{flex:1}
.top .count{font-family:var(--display);font-weight:800;min-width:44px;text-align:right}
.stage{display:flex;flex-direction:column;gap:16px;min-height:340px}
.kicker{font-family:var(--display);font-weight:700;font-size:18px;color:var(--soft)}
.big{font-family:var(--display);font-weight:800;font-size:34px;line-height:1.1;overflow-wrap:anywhere}
.qrow{display:flex;align-items:center;gap:14px}
.qrow .spk{width:54px;height:54px}
.opts{display:flex;flex-direction:column;gap:12px}
.opt{
  width:100%;text-align:left;min-height:58px;padding:12px 16px;background:var(--card);color:var(--ink);
  border:3px solid var(--line);border-radius:18px;box-shadow:0 4px 0 var(--shadow);font-size:18px;font-weight:700;
  transition:transform .08s,box-shadow .08s;
}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--shadow)}
.opt.good{background:var(--mint);color:var(--on);animation:pop .35s}
.opt.bad{background:var(--bad);color:var(--on);animation:shake .35s}
.opt.locked{pointer-events:none}
@keyframes pop{50%{transform:scale(1.03)}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.flash{
  display:flex;flex-direction:column;justify-content:center;align-items:center;gap:8px;text-align:center;min-height:220px;
  padding:22px;background:var(--card);border:3px solid var(--line);border-radius:26px;box-shadow:0 6px 0 var(--shadow);cursor:pointer;
}
.flash .big{font-size:36px}
.flash .en{font-family:var(--display);font-weight:800;font-size:28px;line-height:1.1}
.flash .say{font-size:18px;color:var(--soft);font-style:italic}
.flash .note{font-size:15px;background:var(--cheese);color:var(--on);border-radius:12px;padding:6px 12px;margin-top:6px}
.flash .hint{color:var(--soft);font-size:15px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tray{min-height:76px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;padding:12px;border:3px dashed var(--line);border-radius:20px;background:var(--card)}
.bank{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;min-height:56px}
.tok{padding:8px 14px;min-height:46px;background:var(--lilac);color:var(--on);border:3px solid var(--line);border-radius:14px;box-shadow:0 3px 0 var(--shadow);font-family:var(--display);font-weight:800;font-size:20px;transition:transform .08s,box-shadow .08s}
.tok:active{transform:translateY(2px);box-shadow:0 1px 0 var(--shadow)}
.tray .tok{background:var(--cheese)}
.tray.good{border-style:solid;background:var(--mint);color:var(--on)}
.tray.bad{border-style:solid;background:var(--bad)}
.tray.good .tok,.tray.bad .tok{background:var(--card);color:var(--ink);pointer-events:none}
.fb{position:sticky;bottom:0;padding-top:14px;margin-top:8px}
.sheet{display:flex;flex-direction:column;gap:12px;background:var(--card);border:3px solid var(--line);border-radius:22px;box-shadow:0 5px 0 var(--shadow);padding:14px;animation:rise .25s}
.sheet.ok{background:var(--mint);color:var(--on)} .sheet.no{background:var(--bad);color:var(--on)}
.sheet .who{display:flex;gap:12px;align-items:center}
.sheet .hl{font-family:var(--display);font-weight:800;font-size:24px;line-height:1.05}
.sheet .hl small{font-size:15px;color:var(--on);opacity:.75;font-family:var(--body)}
.sheet .say{font-style:italic;opacity:.85}
.sheet .nt{font-size:14px}
@keyframes rise{from{transform:translateY(16px);opacity:0}}

/* symbols */
.ic{flex:none;display:inline-block;vertical-align:middle}
.ic.fill{fill:currentColor;fill-opacity:.3}
.i-flame{color:#FF5C3A}.i-star{color:#F2A91B}.i-cheese{color:#E8A215}
.chip .ic{margin-bottom:2px}
.btn .ic{margin:0}

/* bottom tabs */
.nav{
  position:fixed;left:0;right:0;bottom:0;z-index:4;display:flex;justify-content:center;gap:12px;
  padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:var(--bg);border-top:3px solid var(--line);
}
.nav[hidden]{display:none}
.nav button{
  flex:1;max-width:240px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px;
  border:3px solid transparent;border-radius:16px;background:none;font-family:var(--display);font-weight:800;font-size:15px;color:var(--soft);
}
.nav button.on{background:var(--cheese);color:var(--on);border-color:var(--line);box-shadow:0 3px 0 var(--shadow)}

/* forms */
.inp{
  width:100%;min-height:50px;padding:10px 14px;border:3px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink);
  font:inherit;font-weight:700;font-size:18px;
}
.inp::placeholder{color:var(--soft);opacity:.8}
textarea.inp{resize:none;min-height:84px;line-height:1.3}
.btn.sm{min-height:46px;padding:6px 16px;font-size:18px}
.inl{display:flex;gap:8px;margin-top:10px}
.inl .inp{min-height:46px;font-size:17px;padding:6px 12px}

/* translate */
.tr{display:flex;flex-direction:column;gap:12px}
.tr label{font-family:var(--display);font-weight:800;font-size:17px;margin-bottom:-6px}
.dirrow{display:flex;align-items:center;justify-content:space-between;gap:10px;font-family:var(--display);font-weight:800;font-size:20px}
.dirrow span:first-child{flex:1}.dirrow span:last-child{flex:1;text-align:right}
.swap{width:46px;height:46px;flex:none;border-radius:50%;border:3px solid var(--line);background:var(--lilac);color:var(--on);display:grid;place-items:center;box-shadow:0 3px 0 var(--shadow);padding:0}
.swap:active{transform:translateY(2px);box-shadow:0 1px 0 var(--shadow)}
.res{display:flex;flex-direction:column;gap:12px;margin-top:16px}
.srcl{font-size:14px;font-weight:700;color:var(--soft)}
.en2{font-size:20px;font-weight:700}
.gloss{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.gloss li{display:flex;justify-content:space-between;gap:14px;padding-bottom:8px;border-bottom:2px dashed var(--track);font-size:18px}
.gloss li:last-child{border-bottom:0;padding-bottom:0}
.gloss span{text-align:right}
details.add{margin-top:16px}
details.add summary{cursor:pointer;font-family:var(--display);font-weight:800;font-size:19px}
details.add form{margin-top:14px}
.empty{display:flex;align-items:center;gap:14px}
.del{width:40px;height:40px;background:var(--bad)}
.inst{font-size:14px;margin:14px auto;max-width:34ch}

/* finish */
.fin{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding-top:18px}
.fin h1{font-size:40px}
.score{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%}
.score .card{display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px}
.score b{font-family:var(--display);font-size:34px;line-height:1.1}
.fin .btn{width:100%}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.confetti i{position:absolute;top:-24px;left:var(--x);width:12px;height:12px;background:var(--c);border-radius:var(--r);animation:fall var(--d) linear var(--dl) forwards;border:2px solid #3A1D4A}
@keyframes fall{to{transform:translate3d(var(--dx),110vh,0) rotate(var(--rot))}}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .confetti{display:none}
}
@media (max-width:380px){
  .grid{gap:10px} .tcard{min-height:140px;padding:12px} .tcard .tn{font-size:20px} .big{font-size:30px}
}
</style>
</head>

/* ---------- helpers ---------- */
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rand=a=>a[Math.floor(Math.random()*a.length)];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const norm=s=>s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9\s]/g,"").replace(/\s+/g," ").trim();
const toks=it=>it.pt.split(" ");
const buildable=items=>items.filter(it=>{const n=toks(it).length;return n>=2&&n<=8;});

/* ---------- saved progress (light, per browser) ---------- */
const KEY="queijinho-v1";
let S={xp:0,streak:0,last:"",day:"",dayXp:0,m:{},name:"",notes:[]};
try{const raw=localStorage.getItem(KEY);if(raw)S=Object.assign(S,JSON.parse(raw));}catch(e){}
if(!Array.isArray(S.notes))S.notes=[];
if(typeof S.name!=="string")S.name="";
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
const z=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate());
const todayStr=()=>ymd(new Date());
const yesterdayStr=()=>{const d=new Date();d.setDate(d.getDate()-1);return ymd(d);};
const dayXp=()=>S.day===todayStr()?S.dayXp:0;
const streakNow=()=>(S.last===todayStr()||S.last===yesterdayStr())?S.streak:0;
function addXp(n){
  if(S.day!==todayStr()){S.day=todayStr();S.dayXp=0;}
  if(S.last!==todayStr()){S.streak=(S.last===yesterdayStr())?S.streak+1:1;S.last=todayStr();}
  S.dayXp+=n;S.xp+=n;save();
}
const lvl=it=>S.m[it.id]||0;
function bump(it,d){S.m[it.id]=Math.max(0,Math.min(5,lvl(it)+d));save();}
const GOAL=30;

/* ---------- speech ---------- */
const TTS=("speechSynthesis" in window)&&("SpeechSynthesisUtterance" in window);
let voice=null;
function pickVoice(){try{const v=speechSynthesis.getVoices();voice=v.find(x=>/pt[-_]BR/i.test(x.lang))||v.find(x=>/^pt/i.test(x.lang))||null;}catch(e){}}
if(TTS){pickVoice();try{speechSynthesis.addEventListener("voiceschanged",pickVoice);}catch(e){}}
function speak(text){
  if(!TTS)return;
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text.replace(/\s\/\s/g,", "));u.lang="pt-BR";if(voice)u.voice=voice;u.rate=.85;speechSynthesis.speak(u);}catch(e){}
}

/* ---------- sessions ---------- */
const cur=()=>sess.steps[sess.i];
function pickMode(){const m=["pt2en","en2pt"];if(TTS)m.push("listen");return rand(m);}

function start(kind,items,title,back){
  let steps;
  if(kind==="flip")steps=items.map(it=>({t:"flip",it}));
  else if(kind==="build")steps=items.map(it=>({t:"build",it}));
  else if(kind==="mc")steps=items.map(it=>({t:"mc",it,mode:pickMode()}));
  else steps=items.map(it=>(buildable([it]).length&&toks(it).length>=3&&Math.random()<.35)?{t:"build",it}:{t:"mc",it,mode:pickMode()});
  sess={kind,items,title,back,steps,i:0,right:0,xp:0,total:steps.length,answered:false,args:[kind,items,title,back]};
  stepView();window.scrollTo(0,0);
}
function startTopic(kind,id){
  const t=TOPIC(id),all=inTopic(id);
  const pool=kind==="build"?buildable(all):all;
  const items=shuffle(pool).slice(0,kind==="build"?8:10);
  start(kind,items,t.pt,id);
}
function startDaily(){
  const items=ALL.concat(noteItems()).map(x=>({x,s:lvl(x)+Math.random()*1.8-(x.topic==="caderno"?.6:0)})).sort((a,b)=>a.s-b.s).slice(0,10).map(o=>o.x);

function shell(inner){

}

/* flashcards */
function flipView(st){

function gradeFlip(ok){
  const st=cur(),it=st.it;
  if(ok){bump(it,1);if(!st.retried){sess.right++;sess.xp+=2;addXp(2);}else{sess.xp+=1;addXp(1);}}
  else{bump(it,-1);if(!st.retried)sess.steps.push({t:"flip",it,retried:true});}

/* multiple choice */
function makeOptions(it,mode){
  const same=shuffle(inTopic(it.topic).filter(x=>x.id!==it.id));
  const rest=shuffle(ALL.filter(x=>x.topic!==it.topic));
  const key=mode==="en2pt"?"pt":"en";
  const picked=[],seen=new Set([norm(it[key])]);
  for(const x of same.concat(rest)){
    if(picked.length>=3)break;
    const k=norm(x[key]);
    if(seen.has(k))continue;
    seen.add(k);picked.push(x);
  }
  return shuffle([{text:it[key],ok:true}].concat(picked.map(x=>({text:x[key],ok:false}))));
}
function mcView(st){
  const it=st.it;
  st.opts=makeOptions(it,st.mode);
  let q;
  if(st.mode==="pt2en")q=`<div class="kicker">What does this mean?</div><div class="qrow">${spk(it)}<div class="big" style="flex:1">${esc(it.pt)}</div></div>`;
  else if(st.mode==="en2pt")q=`<div class="kicker">How do you say this in Portuguese?</div><div class="big">${esc(it.en)}</div>`;
  else q=`<div class="kicker">Listen, then pick the meaning</div><div class="qrow">${spk(it)}<div class="sub">Tap the speaker to hear it again</div></div>`;
  app.innerHTML=shell(`${q}<div class="opts">${st.opts.map((o,i)=>`<button class="opt" data-act="opt" data-i="${i}">${esc(o.text)}</button>`).join("")}</div>`);
  if(st.mode==="listen")speak(it.pt);
}
function answerMC(i){
  if(sess.answered)return;sess.answered=true;
  const st=cur(),ok=st.opts[i].ok;
  app.querySelectorAll(".opt").forEach((b,j)=>{b.classList.add("locked");if(st.opts[j].ok)b.classList.add("good");else if(j===i)b.classList.add("bad");});
  if(ok){bump(st.it,1);if(!st.retried){sess.right++;sess.xp+=5;addXp(5);}else{sess.xp+=2;addXp(2);}}
  else{bump(st.it,-1);if(!st.retried)sess.steps.push({t:"mc",it:st.it,mode:st.mode,retried:true});}
  speak(st.it.pt);
  showFb(ok,st.it);
}

/* build the sentence */
function buildView(st){
  const it=st.it,tk=toks(it);
  let order=shuffle(tk.map((_,i)=>i));
  for(let n=0;n<6&&order.every((v,i)=>v===i);n++)order=shuffle(order);
  st.bank=order;st.ans=[];
  app.innerHTML=shell(`
    <div class="kicker">Say it in Portuguese</div>
    <div class="big">${esc(it.en)}</div>
    <div class="tray" id="tray" aria-label="Your sentence"></div>
    <div class="bank" id="bank"></div>
    <button class="btn mint wide" id="chk" data-act="check" disabled>Verificar</button>`);
  paintBuild();
}
function paintBuild(){
  const st=cur(),tk=toks(st.it);
  document.getElementById("tray").innerHTML=st.ans.map(i=>`<button class="tok" data-act="untok" data-i="${i}">${esc(tk[i])}</button>`).join("");
  document.getElementById("bank").innerHTML=st.bank.map(i=>`<button class="tok" data-act="tok" data-i="${i}">${esc(tk[i])}</button>`).join("");
  document.getElementById("chk").disabled=st.bank.length>0;
}
function moveTok(i,toAns){
  if(sess.answered)return;
  const st=cur(),a=toAns?st.bank:st.ans,b=toAns?st.ans:st.bank;
  const k=a.indexOf(i);if(k<0)return;a.splice(k,1);b.push(i);paintBuild();
}
function checkBuild(){
  if(sess.answered)return;
  const st=cur(),tk=toks(st.it);
  if(st.bank.length)return;
  sess.answered=true;
  const ok=norm(st.ans.map(i=>tk[i]).join(" "))===norm(st.it.pt);
  const tray=document.getElementById("tray");tray.classList.add(ok?"good":"bad");
  document.getElementById("chk").hidden=true;
  if(ok){bump(st.it,1);if(!st.retried){sess.right++;sess.xp+=8;addXp(8);}else{sess.xp+=3;addXp(3);}}
  else{bump(st.it,-1);if(!st.retried)sess.steps.push({t:"build",it:st.it,retried:true});}
  speak(st.it.pt);
  showFb(ok,st.it);
}

const normKey=s=>norm(s).replace(/^(to|the|a|an|o|os|as|um|uma) /,"");
function noteItems(){return S.notes.map(x=>({id:"my:"+norm(x.pt),pt:x.pt,en:x.en,say:"",note:"",topic:"caderno"}));}
function addNote(pt,en){
  pt=(pt||"").trim();en=(en||"").trim();
  if(!pt||!en)return false;
  if(!S.notes.some(n=>norm(n.pt)===norm(pt)))S.notes.unshift({pt,en});
  save();return true;
}
function dictLookup(q,dir){
  const k=normKey(q);if(!k)return null;
  for(const e of DICT){
    if(dir==="en"){if(normKey(e.en)===k)return {pt:e.pt,en:q.trim()};}
    else if(e.pt.split(" / ").some(v=>normKey(v)===k))return {pt:q.trim(),en:e.en.replace(/^to /,"to ")};
  }
  return null;
}
function bookLookup(q,dir){
  const k=norm(q);
  for(const x of ALL){
    if(dir==="pt"){if(norm(x.pt)===k)return {pt:x.pt,en:x.en};}
    else{
      const vs=x.en.replace(/\(.*?\)/g,"").split(" / ").map(norm);
      if(vs.includes(k))return {pt:x.pt,en:x.en};
    }
  }
  return null;
}
function decodeHtml(s){const t=document.createElement("textarea");t.innerHTML=s;return t.value;}
async function onlineTranslate(q,dir){
  const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),8000);
  try{
    const lp=dir==="en"?"en|pt-BR":"pt-BR|en";
    const r=await fetch("https://api.mymemory.translated.net/get?q="+encodeURIComponent(q)+"&langpair="+encodeURIComponent(lp),{signal:ctl.signal});
    if(!r.ok)return null;
    const j=await r.json();
    let t=j&&j.responseData&&j.responseData.translatedText;
    if(!t||/MYMEMORY WARNING|INVALID|QUERY LENGTH/i.test(t))return null;
    t=decodeHtml(t).trim();
    if(!t||norm(t)===norm(q))return null;
    return t;
  }catch(e){return null;}finally{clearTimeout(to);}
}
async function lookup(q){
  const dir=tr.dir,words=q.split(/\s+/).filter(Boolean);
  const b=bookLookup(q,dir);
  if(b)return {pt:b.pt,en:b.en,label:"From the Queijinho phrasebook"};
  if(words.length===1){
    const d=dictLookup(q,dir);
    if(d)return {pt:d.pt,en:d.en,label:"From the offline word list"};
  }
  const m=await mtTranslate(q,dir);
  if(m)return dir==="en"?{pt:m,en:q,label:MT_LABEL}:{pt:q,en:m,label:MT_LABEL};
  let tried=false;
  if(MT.has===false&&navigator.onLine!==false){
    tried=true;
    const t=await onlineTranslate(q,dir);
    if(t)return dir==="en"?{pt:t,en:q,label:"Online translation. Double-check it before you rely on it."}:{pt:q,en:t,label:"Online translation. Double-check it before you rely on it."};
  }
  const gloss=[];
  words.forEach(w=>{const d=dictLookup(w.replace(/[.,!?¿¡]/g,""),dir);if(d)gloss.push({w,m:dir==="en"?d.pt:d.en});});
  if(gloss.length)return {gloss,note:tried?"I couldn't reach the online translator. Here is what I know word by word:":"You're offline, so I can't do whole sentences. Here is what I know word by word:"};
  return {none:true};
}
const MT={has:undefined,t:null};
const MT_LABEL="Offline translator. It can lean toward European Portuguese, so check it against the phrasebook.";
async function mtTranslate(q,dir){
  if(MT.has===false)return null;
  try{
    if(MT.has===undefined){
      const r=await fetch("models/registry.json");
      if(!r.ok){MT.has=false;return null;}
      await r.clone().json();
      MT.has=true;
    }
    if(!MT.t){
      const m=await import("./vendor/bergamot/translator.js");
      MT.t=new m.LatencyOptimisedTranslator({registryUrl:"models/registry.json",pivotLanguage:null,downloadTimeout:0});
    }
    const r=await Promise.race([
      MT.t.translate({from:dir==="en"?"en":"pt",to:dir==="en"?"pt":"en",text:q,html:false}),
      new Promise((_,rej)=>setTimeout(()=>rej(new Error("The offline translator took too long.")),90000))
    ]);
    const t=((r&&r.target&&r.target.text)||"").trim();
    return t||null;
  }catch(e){
    console.error(e);
    if(MT.has===undefined)MT.has=false;
    MT.t=null;
    return null;
  }
}
let trToken=0;
async function doTranslate(){
  const el=document.getElementById("trq");
  const q=(el?el.value:tr.q).trim();tr.q=q;
  if(!q){tr.res=null;render();return;}
  const my=++trToken;
  tr.res={loading:true,first:MT.has!==false&&!MT.t};render();
  const r=await lookup(q);
  if(my!==trToken)return;
  tr.res=r;render();
}
function resHTML(){
  const r=tr.res;if(!r)return "";
  if(r.loading)return `<div class="card res" aria-live="polite"><div class="sub">${r.first?"Waking up the offline translator. The first one takes a few seconds, then it is quick.":"Traduzindo…"}</div></div>`;
  if(r.none)return `<div class="card res" aria-live="polite"><b>Hmm, I don't know that one offline.</b><p class="sub">I couldn't translate that. You can use "Add your own" below to save it yourself.</p></div>`;
  if(r.gloss)return `<div class="card res" aria-live="polite"><div class="srcl">${esc(r.note)}</div><ul class="gloss">${r.gloss.map(g=>`<li><b>${esc(g.w)}</b><span>${esc(g.m)}</span></li>`).join("")}</ul></div>`;
  const saved=S.notes.some(n=>norm(n.pt)===norm(r.pt));
  return `<div class="card res" aria-live="polite"><div class="srcl">${esc(r.label)}</div>
    <div class="qrow">${spk({pt:r.pt})}<div class="big" style="flex:1">${esc(r.pt)}</div></div>
    <div class="en2">${esc(r.en)}</div>
    ${saved?`<div class="btn mint wide" style="pointer-events:none">${ico("check",20)} Saved in your notebook</div>`:`<button class="btn mint wide" data-act="save">${ico("plus",20)} Save to notebook</button>`}</div>`;
}
function translateHTML(){
  const from=tr.dir==="en"?"English":"Português",to=tr.dir==="en"?"Português":"English";
  const items=noteItems(),canBuild=buildable(items).length>=2;
  const list=items.length?`
    <div class="acts">
      <button class="btn mint" data-act="notego" data-k="flip"><span>Cartões</span><small>Flashcards</small></button>
      <button class="btn sky" data-act="notego" data-k="mc"><span>Quiz</span><small>Pick the answer</small></button>
      <button class="btn lilac" data-act="notego" data-k="build" ${canBuild?"":"disabled"}><span>Monte a frase</span><small>${canBuild?"Build the sentence":"Save 2+ phrases to unlock"}</small></button>
    </div>
    <ul class="plist" style="margin-top:14px">${items.map(it=>`<li>${spk(it)}<div class="tx"><div class="pt">${esc(it.pt)}</div><div class="en">${esc(it.en)}</div></div><div class="dots" aria-label="Level ${lvl(it)} of 5">${[1,2,3,4,5].map(n=>`<i class="${lvl(it)>=n?"on":""}"></i>`).join("")}</div><button class="spk del" data-act="del" data-k="${esc(norm(it.pt))}" aria-label="Remove ${esc(it.pt)}">${ico("trash",20)}</button></li>`).join("")}</ul>`
    :`<div class="card empty">${mascot("happy",76)}<p>Nothing saved yet. Translate something and tap Save. Everything you save turns into flashcards, quizzes and sentence games.</p></div>`;
  return `
  <h1>Traduzir</h1><div class="sub">Translate, then save what you want to learn</div>
  <form class="card tr" data-form="tr" style="margin-top:14px">
    <div class="dirrow"><span>${from}</span><button type="button" class="swap" data-act="swap" aria-label="Swap languages">${ico("swap",22)}</button><span>${to}</span></div>
    <textarea id="trq" class="inp" rows="2" maxlength="300" placeholder="${tr.dir==="en"?"Type a word or phrase":"Escreva uma palavra ou frase"}" aria-label="Text to translate">${esc(tr.q)}</textarea>
    <button class="btn pink wide" type="submit">Traduzir</button>
  </form>
  ${resHTML()}
  <details class="card add"><summary>Add your own <small>(from a friend, a sign, a menu)</small></summary>
    <form class="tr" data-form="add">
      <label for="addpt">Português</label><input id="addpt" class="inp" maxlength="120" autocomplete="off">
      <label for="adden">English</label><input id="adden" class="inp" maxlength="120" autocomplete="off">
      <button class="btn mint wide" type="submit">${ico("plus",20)} Save to notebook</button>
    </form>
  </details>
  <h2 class="sec">Meu caderno <small>${items.length} saved</small></h2>
  ${list}`;
}

/* ---------- events ---------- */
app.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;
  const a=b.dataset.act;
  if(a==="say"){e.stopPropagation();speak(b.dataset.txt);}
  else if(a==="home")go("home");
  else if(a==="translate")go("translate");
  else if(a==="open")go("topic",b.dataset.t);
  else if(a==="topicgo")startTopic(b.dataset.k,b.dataset.t);
  else if(a==="daily")startDaily();
  else if(a==="quit"||a==="leave")leave();
  else if(a==="flip")revealFlip();
  else if(a==="know")gradeFlip(true);
  else if(a==="again")gradeFlip(false);
  else if(a==="opt")answerMC(+b.dataset.i);
  else if(a==="tok")moveTok(+b.dataset.i,true);
  else if(a==="untok")moveTok(+b.dataset.i,false);
  else if(a==="check")checkBuild();
  else if(a==="next")nextStep();
  else if(a==="again2"){
    if(sess.kind==="mix")startDaily();
    else if(sess.back)startTopic(sess.kind,sess.back);
  }
  else if(a==="swap"){const q=document.getElementById("trq");tr.q=q?q.value:tr.q;tr.dir=tr.dir==="en"?"pt":"en";tr.res=null;render();}
  else if(a==="save"){if(tr.res&&tr.res.pt)addNote(tr.res.pt,tr.res.en);render();}
  else if(a==="del"){S.notes=S.notes.filter(n=>norm(n.pt)!==b.dataset.k);save();render();}
  else if(a==="notego")startTopic(b.dataset.k,"caderno");
  else if(a==="rename"){S.name="";save();render();}
  else if(a==="install"){if(deferredInstall){deferredInstall.prompt();deferredInstall=null;render();}}
  else if(a==="reset"){
    if(!resetArmed){resetArmed=true;render();}
    else{S.xp=0;S.streak=0;S.last="";S.day="";S.dayXp=0;S.m={};save();resetArmed=false;render();}
  }
});
navEl.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;
  if(b.dataset.act==="home")go("home");else if(b.dataset.act==="translate")go("translate");
});
app.addEventListener("submit",e=>{
  const f=e.target.closest("form[data-form]");if(!f)return;
  e.preventDefault();
  const k=f.dataset.form;
  if(k==="name"){S.name=document.getElementById("nm").value.trim().slice(0,20);save();render();}
  else if(k==="tr")doTranslate();
  else if(k==="add"){
    const pt=document.getElementById("addpt").value,en=document.getElementById("adden").value;
    if(addNote(pt,en))render();
  }
});
app.addEventListener("keydown",e=>{
  if(e.target.id==="trq"&&e.key==="Enter"&&!e.shiftKey){e.preventDefault();doTranslate();return;}
  if((e.key==="Enter"||e.key===" ")&&e.target.id==="flash"){e.preventDefault();revealFlip();}
});

window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredInstall=e;if(view==="home"&&!sess)render();});
if("serviceWorker" in navigator&&/^https?:/.test(location.protocol)){
  window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{});});
}
render();
})();
</script>
</body>
</html>
